name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Resolve dependency lock when absent
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile on working branch
        if: ${{ github.event_name == 'push' && hashFiles('package-lock.json') != '' }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "chore: commit verified dependency lockfile"
          git push
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Expo Doctor
        run: npm run doctor
      - name: Web export smoke
        run: npm run build:smoke
