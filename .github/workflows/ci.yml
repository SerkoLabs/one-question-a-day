name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.gate }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: typecheck
            command: npm run typecheck
          - gate: lint
            command: npm run lint
          - gate: unit-tests
            command: npm run test:ci
          - gate: expo-doctor
            command: npm run doctor
          - gate: web-export
            command: npm run build:smoke
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_placeholder_abcdefghijklmnopqrstuvwxyz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Resolve dependency lock when absent
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ${{ matrix.gate }}
        run: ${{ matrix.command }}
